package envoy.extensions.filters.http.rate_limit_quota_apig.v3;

import "envoy/config/core/v3/base.proto";
import "envoy/config/core/v3/extension.proto";
import "envoy/config/core/v3/grpc_service.proto";
import "envoy/type/v3/http_status.proto";
import "envoy/type/v3/ratelimit_strategy.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/rpc/status.proto";

import "xds/annotations/v3/status.proto";
import "xds/type/matcher/v3/matcher.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.rate_limit_quota_apig.v3";
option java_outer_classname = "RateLimitQuotaApigProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/rate_limit_quota_apig/v3;rate_limit_quota_apigv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Rate Limit Quota]
// Rate Limit Quota :ref:`configuration overview <config_http_filters_rate_limit_quota>`.
// [#extension: envoy.filters.http.rate_limit_quota_apig]

// Configures the Rate Limit Quota filter.
//
// Can be overridden in the per-route and per-host configurations.
// The more specific definition completely overrides the less specific definition.
// [#next-free-field: 109]
message RateLimitQuotaFilterConfig {
  // Configures the gRPC Rate Limit Quota Service (RLQS) RateLimitQuotaService.
  config.core.v3.GrpcService rlqs_server = 1 [(validate.rules).message = {required: true}];

  // The application domain to use when calling the service. This enables sharing the quota
  // server between different applications without fear of overlap.
  // E.g., "envoy".
  string domain = 2 [(validate.rules).string = {min_len: 1}];

  // The match tree to use for grouping incoming requests into buckets.
  //
  // Example:
  //
  // .. validated-code-block:: yaml
  //   :type-name: xds.type.matcher.v3.Matcher
  //
  //   matcher_list:
  //     matchers:
  //     # Assign requests with header['env'] set to 'staging' to the bucket { name: 'staging' }
  //     - predicate:
  //         single_predicate:
  //           input:
  //             typed_config:
  //               '@type': type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
  //               header_name: env
  //           value_match:
  //             exact: staging
  //       on_match:
  //         action:
  //           typed_config:
  //             '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings
  //             bucket_id_builder:
  //               bucket_id_builder:
  //                 name:
  //                   string_value: staging
  //
  //     # Assign requests with header['user_group'] set to 'admin' to the bucket { acl: 'admin_users' }
  //     - predicate:
  //         single_predicate:
  //           input:
  //             typed_config:
  //               '@type': type.googleapis.com/xds.type.matcher.v3.HttpAttributesCelMatchInput
  //           custom_match:
  //             typed_config:
  //               '@type': type.googleapis.com/xds.type.matcher.v3.CelMatcher
  //               expr_match:
  //                 # Shortened for illustration purposes. Here should be parsed CEL expression:
  //                 # request.headers['user_group'] == 'admin'
  //                 parsed_expr: {}
  //       on_match:
  //         action:
  //           typed_config:
  //             '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings
  //             bucket_id_builder:
  //               bucket_id_builder:
  //                 acl:
  //                   string_value: admin_users
  //
  //   # Catch-all clause for the requests not matched by any of the matchers.
  //   # In this example, deny all requests.
  //   on_no_match:
  //     action:
  //       typed_config:
  //         '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings
  //         no_assignment_behavior:
  //           fallback_rate_limit:
  //             blanket_rule: DENY_ALL
  //
  // .. attention::
  //  The first matched group wins. Once the request is matched into a bucket, matcher
  //  evaluation ends.
  //
  // Use ``on_no_match`` field to assign the catch-all bucket. If a request is not matched
  // into any bucket, and there's no  ``on_no_match`` field configured, the request will be
  // ALLOWED by default. It will NOT be reported to the RLQS server.
  //
  // Refer to :ref:`Unified Matcher API <envoy_v3_api_msg_.xds.type.matcher.v3.Matcher>`
  // documentation for more information on the matcher trees.
  xds.type.matcher.v3.Matcher bucket_matchers = 3 [(validate.rules).message = {required: false}];

  // If set, this will enable -- but not necessarily enforce -- the rate limit for the given
  // fraction of requests.
  //
  // Defaults to 100% of requests.
  config.core.v3.RuntimeFractionalPercent filter_enabled = 4;

  // If set, this will enforce the rate limit decisions for the given fraction of requests.
  // For requests that are not enforced the filter will still obtain the quota and include it
  // in the load computation, however the request will always be allowed regardless of the outcome
  // of quota application. This allows validation or testing of the rate limiting service
  // infrastructure without disrupting existing traffic.
  //
  // Note: this only applies to the fraction of enabled requests.
  //
  // Defaults to 100% of requests.
  config.core.v3.RuntimeFractionalPercent filter_enforced = 5;

  // Specifies a list of HTTP headers that should be added to each request that
  // has been rate limited and is also forwarded upstream. This can only occur when the
  // filter is enabled but not enforced.
  repeated config.core.v3.HeaderValueOption request_headers_to_add_when_not_enforced = 6
      [(validate.rules).repeated = {max_items: 10}];

  // The human readable prefix to use when emitting stats.
  string stat_prefix = 101 ;

  google.protobuf.Duration reporting_interval = 102 [(validate.rules).duration = {
    required: false
    gt {nanos: 100000000}
  }];

  // Configuration for degradation mode when global tokens are scarce.
  // When enabled, the filter will switch to synchronous rate limiting
  // to ensure accuracy.
  DegradationModeConfig degradation_mode_config = 103;

  // Long-tail (cold) vs high-frequency (hot) split: low-frequency bucket ids use a per-request
  // sync check to the quota service; only entries exceeding a local frequency threshold get a
  // cached bucket and periodic reports.
  //
  // If this field is omitted, cold/hot is **enabled** (same as an empty :ref:`ColdHotSplitConfig`
  // with ``disabled: false``): see defaults on :ref:`max_tracked_buckets
  // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.ColdHotSplitConfig.max_tracked_buckets>`.
  ColdHotSplitConfig cold_hot_config = 104;

  // Soft cap on distinct buckets retained in the RLQS client's main-thread cache before
  // switching to a 1-minute idle eviction threshold (vs. 5 minutes when at or below the cap).
  // If unset or 0, 50000 is used. Tune for memory vs. bucket cardinality.
  uint32 max_bucket_cache_entries = 105 [(validate.rules).uint32 = {lte: 10000000}];

  // Configuration for dynamically extracting _tenant and _scope to append to BucketId.
  // This allows the filter to construct tenant-aware and scope-aware bucket IDs 
  // without needing to statically define them in the bucket_matchers.
  // 
  // Example usage:
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.extensions.filters.http.rate_limit_quota_apig.v3.TenantKeySource
  //
  //   tenant:
  //     order: [LISTENER_METADATA, FILTER_CHAIN_NAME]
  //     metadata_namespace: "apig_tenant"
  //     metadata_field: "tenant_id"
  //     chain_name_pattern: "^tenant-(.+)-fc$"
  //     capture_group: 1
  //   scope:
  //     type: ROUTE_NAME
  //     prefix: "route:"
  TenantKeySource tenant_key_source = 106;

  // Configures the gRPC Rate Limit Quota Config Discovery Service (RLQS
  // Conf DS). When set, the filter subscribes to the same gRPC server (or
  // a different one) and receives per-(tenant, scope) ``BucketSettings``
  // overrides — most importantly the per-dimension ``deny_response_settings``
  // and the ``bucket_id_builder._dim`` tag — that drive multi-dimension
  // quota checks (T-EC-08 spec § D-2 / D-7 / D-8). When unset the filter
  // falls back to the static xDS ``bucket_matchers`` only.
  //
  // The wire contract is xDS-flavored: the filter sends a
  // ``DiscoveryRequest`` per (tenant, scope) it has seen at request time;
  // the server replies with one or more ``RateLimitQuotaBucketSettings``
  // resources (one per configured dimension). The filter merges the
  // pushed ``bucket_id_builder`` over the matched static builder so each
  // dimension fans out into its own ``BucketId`` for independent quota
  // accounting.
  config.core.v3.GrpcService rlqs_config_server = 107;

  // When true, the token-usage extractor also attempts agent-shaped response
  // formats (DashScope/Bailian ``usage.models[*]``, Dify
  // ``metadata.usage.*``, Coze ``data.usage.*_count``). Default false: only
  // canonical LLM provider paths (OpenAI, Anthropic, Gemini, Bedrock, DashScope
  // legacy) are tried. Enable per-listener when the gateway fronts agent
  // services so token consumption reported to RLQS reflects the aggregated
  // multi-model cost.
  bool extract_agent_token_usage = 108;
}

// Configures the dynamic extraction of tenant and scope keys.
message TenantKeySource {
  message TenantConfig {
    enum SourceType {
      LISTENER_METADATA = 0;
      FILTER_CHAIN_NAME = 1;
    }
    repeated SourceType order = 1;
    // default: "apig_tenant"
    string metadata_namespace = 2;
    // default: "tenant_id"
    string metadata_field = 3;
    // regex pattern to extract tenant from filter chain name
    string chain_name_pattern = 4;
    uint32 capture_group = 5;
  }
  message ScopeConfig {
    enum ScopeType {
      ROUTE_NAME = 0;
      VIRTUAL_HOST_NAME = 1;
      CLUSTER_NAME = 2;
      GLOBAL = 3;
      REQUEST_HEADER = 4;
    }
    ScopeType type = 1;
    // default: "route:" for ROUTE_NAME, "domain:" for VIRTUAL_HOST_NAME, "service:" for CLUSTER_NAME, "global:" for GLOBAL, "header:" for REQUEST_HEADER
    string prefix = 2;
    // The header name to extract the scope from, when type is REQUEST_HEADER
    string header_name = 3;
    // The key to use in the BucketId map. If empty, defaults to "_scope".
    string bucket_key = 4;
    // Only applies when ``type`` is ``ROUTE_NAME``. Default ``false`` — the
    // extracted route name is MD5-hashed (lower-case hex, 32 chars) before being
    // joined with ``prefix`` and written to the BucketId map. The hash bounds
    // the size of the downstream Redis key family on the rate-limit service
    // side, so user-defined route names of arbitrary length cannot push keys
    // past their practical length limit. Set to ``true`` to preserve the
    // literal route name end-to-end. Has no effect on other ``ScopeType``
    // values (VIRTUAL_HOST_NAME / CLUSTER_NAME / GLOBAL / REQUEST_HEADER are
    // always literal).
    bool disable_route_name_hash = 5;
  }
  TenantConfig tenant = 1;
  ScopeConfig scope = 2;
  // Extract additional dynamic dimensions into the BucketId map.
  repeated ScopeConfig additional_scopes = 3;
}

// Configuration for the cold / hot request path split. When ``disabled`` is false (default
// if the message is omitted, i.e. treat-as-disabled only when :ref:`disabled` is set true in YAML),
// use :ref:`hotspot_threshold` and a sliding window to decide when to call
// :ref:`RateLimitClient.createBucket` vs. synchronous quota check on the first visits.
message ColdHotSplitConfig {
  // If true, disable cold/hot logic: every first-seen bucket uses the legacy ``createBucket`` path.
  bool disabled = 1;

  // Minimum number of process-wide frequency counter updates for the same hashed bucket id within
  // :ref:`frequency_window` before promoting the bucket to hot (creating a CachedBucket). If
  // set to 0, a default of 10 is used.
  uint32 hotspot_threshold = 2;

  // Sliding time window for :ref:`hotspot_threshold` counting. If unset, 1 second is used.
  google.protobuf.Duration frequency_window = 3;

  // Max distinct bucket id hashes held in the process-wide (sharded) LRU (caps tracker memory
  // and the number of cold-path frequency slots). If 0 or unset, 10000 is used.
  uint64 max_tracked_buckets = 4;

  // Timeout for cold-path sync quota check. If unset, ``cold`` uses 20ms, then
  // :ref:`degradation_mode_config.sync_check_timeout` if set.
  google.protobuf.Duration cold_sync_timeout = 5;

  // If true, on cold-path check failure/timeout, allow the request. If false, deny. When
  // :ref:`RateLimitQuotaFilterConfig.cold_hot_config` is not set, cold path falls back to
  // :ref:`degradation_mode_config` for timeout and fallback.
  bool cold_fallback_allow_on_error = 6;

  // If the long-tail (cold) path is selected but a :ref:`SyncQuotaChecker` cannot be created
  // (e.g. ``rlqs_server`` not configured in tests), this controls behavior.
  NoSyncCheckerPolicy no_sync_checker_policy = 7;

  enum NoSyncCheckerPolicy {
    // Fall through to ``createBucket`` (same as legacy, avoids blocking without an RLQS).
    PROMOTE_TO_HOT = 0;
    // Allow the request without a sync check.
    FAIL_OPEN = 1;
    // Deny the request.
    FAIL_CLOSE = 2;
  }
}

// Configuration for degradation mode.
// When global remaining tokens are below the threshold, the filter switches
// from local token bucket to synchronous rate limiting for accuracy.
//
// Degradation mode is ENABLED BY DEFAULT. When the quota server signals that
// global tokens are scarce (via DegradationInfo.degraded=true), the filter
// will automatically switch to synchronous quota checking for accuracy.
message DegradationModeConfig {
  // Disable degradation mode support. If true, the filter will always use
  // local token bucket even when the server signals degradation.
  // Default: false (degradation mode is enabled by default)
  bool disabled = 1;

  // Timeout for synchronous quota check in degradation mode.
  // If the quota server doesn't respond within this duration, the request
  // will be handled according to fallback_allow_on_timeout.
  // Default: 100ms
  google.protobuf.Duration sync_check_timeout = 2 [(validate.rules).duration = {
    gt {nanos: 1000000}
  }];

  // Behavior when synchronous check times out.
  // If true, allow the request (fail-open). If false, deny the request (fail-close).
  // Default: true (fail-open)
  bool fallback_allow_on_timeout = 3;
}

// Per-route and per-host configuration overrides. The more specific definition completely
// overrides the less specific definition.
message RateLimitQuotaOverride {
  // The application domain to use when calling the service. This enables sharing the quota
  // server between different applications without fear of overlap.
  // E.g., "envoy".
  //
  // If empty, inherits the value from the less specific definition.
  string domain = 1;

  // The match tree to use for grouping incoming requests into buckets.
  //
  // If set, fully overrides the bucket matchers provided on the less specific definition.
  // If not set, inherits the value from the less specific definition.
  //
  // See usage example: :ref:`RateLimitQuotaFilterConfig.bucket_matchers
  // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaFilterConfig.bucket_matchers>`.
  xds.type.matcher.v3.Matcher bucket_matchers = 2;
}

// Rate Limit Quota Bucket Settings to apply on the successful ``bucket_matchers`` match.
//
// Specify this message in the :ref:`Matcher.OnMatch.action
// <envoy_v3_api_field_.xds.type.matcher.v3.Matcher.OnMatch.action>` field of the
// ``bucket_matchers`` matcher tree to assign the matched requests to the Quota Bucket.
// Usage example: :ref:`RateLimitQuotaFilterConfig.bucket_matchers
// <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaFilterConfig.bucket_matchers>`.
// [#next-free-field: 6]
message RateLimitQuotaBucketSettings {
  // Configures the behavior after the first request has been matched to the bucket, and before the
  // the RLQS server returns the first quota assignment.
  message NoAssignmentBehavior {
    oneof no_assignment_behavior {
      option (validate.required) = true;

      // Apply pre-configured rate limiting strategy until the server sends the first assignment.
      type.v3.RateLimitStrategy fallback_rate_limit = 1;
    }
  }

  // Specifies the behavior when the bucket's assignment has expired, and cannot be refreshed for
  // any reason.
  message ExpiredAssignmentBehavior {
    // Reuse the last known quota assignment, effectively extending it for the duration
    // specified in the :ref:`expired_assignment_behavior_timeout
    // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.ExpiredAssignmentBehavior.expired_assignment_behavior_timeout>`
    // field.
    message ReuseLastAssignment {
    }

    // Limit the time :ref:`ExpiredAssignmentBehavior
    // <envoy_v3_api_msg_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.ExpiredAssignmentBehavior>`
    // is applied. If the server doesn't respond within this duration:
    //
    // 1. Selected ``ExpiredAssignmentBehavior`` is no longer applied.
    // 2. The bucket is abandoned. The process of abandoning the bucket is described in the
    //    :ref:`AbandonAction <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.RateLimitQuotaResponse.BucketAction.AbandonAction>`
    //    message.
    // 3. If a new request is matched into the bucket that has become abandoned,
    //    the data plane restarts the subscription to the bucket. The process of restarting the
    //    subscription is described in the :ref:`AbandonAction
    //    <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.RateLimitQuotaResponse.BucketAction.AbandonAction>`
    //    message.
    //
    // If the field is not set, the ``ExpiredAssignmentBehavior`` time is **not limited**:
    // it applies to the bucket until replaced by an ``active`` assignment.
    google.protobuf.Duration expired_assignment_behavior_timeout = 1
        [(validate.rules).duration = {gt {}}];

    oneof expired_assignment_behavior {
      option (validate.required) = true;

      // Apply the rate limiting strategy to all requests matched into the bucket until the RLQS
      // server sends a new assignment, or the :ref:`expired_assignment_behavior_timeout
      // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.ExpiredAssignmentBehavior.expired_assignment_behavior_timeout>`
      // runs out.
      type.v3.RateLimitStrategy fallback_rate_limit = 2;

      // Reuse the last ``active`` assignment until the RLQS server sends a new assignment, or the
      // :ref:`expired_assignment_behavior_timeout
      // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.ExpiredAssignmentBehavior.expired_assignment_behavior_timeout>`
      // runs out.
      ReuseLastAssignment reuse_last_assignment = 3;
    }
  }

  // Customize the deny response to the requests over the rate limit.
  message DenyResponseSettings {
    // HTTP response code to deny for HTTP requests (gRPC excluded).
    // Defaults to 429 (:ref:`StatusCode.TooManyRequests<envoy_v3_api_enum_value_type.v3.StatusCode.TooManyRequests>`).
    type.v3.HttpStatus http_status = 1;

    // HTTP response body used to deny for HTTP requests (gRPC excluded).
    // If not set, an empty body is returned.
    google.protobuf.BytesValue http_body = 2;

    // Configure the deny response for gRPC requests over the rate limit.
    // Allows to specify the `RPC status code
    // <https://cloud.google.com/natural-language/docs/reference/rpc/google.rpc#google.rpc.Code>`_,
    // and the error message.
    // Defaults to the Status with the RPC Code ``UNAVAILABLE`` and empty message.
    //
    // To identify gRPC requests, Envoy checks that the ``Content-Type`` header is
    // ``application/grpc``, or one of the various ``application/grpc+`` values.
    //
    // .. note::
    //   The HTTP code for a gRPC response is always 200.
    google.rpc.Status grpc_status = 3;

    // Specifies a list of HTTP headers that should be added to each response for requests that
    // have been rate limited. Applies both to plain HTTP, and gRPC requests.
    // The headers are added even when the rate limit quota was not enforced.
    repeated config.core.v3.HeaderValueOption response_headers_to_add = 4
        [(validate.rules).repeated = {max_items: 10}];
  }

  // ``BucketIdBuilder`` makes it possible to build :ref:`BucketId
  // <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.BucketId>` with values substituted
  // from the dynamic properties associated with each individual request. See usage examples in
  // the docs to :ref:`bucket_id_builder
  // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.bucket_id_builder>`
  // field.
  message BucketIdBuilder {
    // Produces the value of the :ref:`BucketId
    // <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.BucketId>` map.
    message ValueBuilder {
      oneof value_specifier {
        option (validate.required) = true;

        // Static string value — becomes the value in the :ref:`BucketId
        // <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.BucketId>` map as is.
        string string_value = 1;

        // Dynamic value — evaluated for each request. Must produce a string output, which becomes
        // the value in the :ref:`BucketId <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.BucketId>`
        // map. For example, extensions with the ``envoy.matching.http.input`` category can be used.
        config.core.v3.TypedExtensionConfig custom_value = 2;
      }
    }

    // The map translated into the ``BucketId`` map.
    //
    // The ``string key`` of this map and becomes the key of ``BucketId`` map as is.
    //
    // The ``ValueBuilder value`` for the key can be:
    //
    // * static ``StringValue string_value`` — becomes the value in the ``BucketId`` map as is.
    // * dynamic ``TypedExtensionConfig custom_value`` — evaluated for each request. Must produce
    //   a string output, which becomes the value in the ``BucketId`` map.
    //
    // See usage examples in the docs to :ref:`bucket_id_builder
    // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.bucket_id_builder>`
    // field.
    map<string, ValueBuilder> bucket_id_builder = 1 [(validate.rules).map = {min_pairs: 1}];
  }

  // ``BucketId`` builder.
  //
  // :ref:`BucketId <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.BucketId>` is a map from
  // the string key to the string value which serves as bucket identifier common for on
  // the control plane and the data plane.
  //
  // While ``BucketId`` is always static, ``BucketIdBuilder`` allows to populate map values
  // with the dynamic properties associated with the each individual request.
  //
  // Example 1: static fields only
  //
  // ``BucketIdBuilder``:
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.BucketIdBuilder
  //
  //   bucket_id_builder:
  //     name:
  //       string_value: my_bucket
  //     hello:
  //       string_value: world
  //
  // Produces the following ``BucketId`` for all requests:
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.service.rate_limit_quota_apig.v3.BucketId
  //
  //   bucket:
  //     name: my_bucket
  //     hello: world
  //
  // Example 2: static and dynamic fields
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.BucketIdBuilder
  //
  //   bucket_id_builder:
  //     name:
  //       string_value: my_bucket
  //     env:
  //       custom_value:
  //         typed_config:
  //           '@type': type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
  //           header_name: environment
  //
  // In this example, the value of ``BucketId`` key ``env`` is substituted from the ``environment``
  // request header.
  //
  // This is equivalent to the following ``pseudo-code``:
  //
  // .. code-block:: yaml
  //
  //    name: 'my_bucket'
  //    env: $header['environment']
  //
  // For example, the request with the HTTP header ``env`` set to ``staging`` will produce
  // the following ``BucketId``:
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.service.rate_limit_quota_apig.v3.BucketId
  //
  //   bucket:
  //     name: my_bucket
  //     env: staging
  //
  // For the request with the HTTP header ``environment`` set to ``prod``, will produce:
  //
  // .. validated-code-block:: yaml
  //   :type-name: envoy.service.rate_limit_quota_apig.v3.BucketId
  //
  //   bucket:
  //     name: my_bucket
  //     env: prod
  //
  // .. note::
  //   The order of ``BucketId`` keys do not matter. Buckets ``{ a: 'A', b: 'B' }`` and
  //   ``{ b: 'B', a: 'A' }`` are identical.
  //
  // If not set, requests will NOT be reported to the server, and will always limited
  // according to :ref:`no_assignment_behavior
  // <envoy_v3_api_field_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.no_assignment_behavior>`
  // configuration.
  BucketIdBuilder bucket_id_builder = 1;

  // The interval at which the data plane (RLQS client) is to report quota usage for this bucket.
  //
  // When the first request is matched to a bucket with no assignment, the data plane is to report
  // the request immediately in the :ref:`RateLimitQuotaUsageReports
  // <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.RateLimitQuotaUsageReports>` message.
  // For the RLQS server, this signals that the data plane is now subscribed to
  // the quota assignments in this bucket, and will start sending the assignment as described in
  // the :ref:`RLQS documentation <envoy_v3_api_file_envoy/service/rate_limit_quota/v3/rlqs.proto>`.
  //
  // After sending the initial report, the data plane is to continue reporting the bucket usage with
  // the internal specified in this field.
  // [#comment: 100000000 nanoseconds = 0.1 seconds]
  google.protobuf.Duration reporting_interval = 2 [(validate.rules).duration = {
    required: true
    gt {nanos: 100000000}
  }];

  // Customize the deny response to the requests over the rate limit.
  // If not set, the filter will be configured as if an empty message is set,
  // and will behave according to the defaults specified in :ref:`DenyResponseSettings
  // <envoy_v3_api_msg_extensions.filters.http.rate_limit_quota_apig.v3.RateLimitQuotaBucketSettings.DenyResponseSettings>`.
  DenyResponseSettings deny_response_settings = 3;

  // Configures the behavior in the "no assignment" state: after the first request has been
  // matched to the bucket, and before the RLQS server returns the first quota assignment.
  //
  // If not set, the default behavior is to allow all requests.
  NoAssignmentBehavior no_assignment_behavior = 4;

  // Configures the behavior in the "expired assignment" state: the bucket's assignment has expired,
  // and cannot be refreshed.
  //
  // If not set, the bucket is abandoned when its ``active`` assignment expires.
  // The process of abandoning the bucket, and restarting the subscription is described in the
  // :ref:`AbandonAction <envoy_v3_api_msg_service.rate_limit_quota_apig.v3.RateLimitQuotaResponse.BucketAction.AbandonAction>`
  // message.
  ExpiredAssignmentBehavior expired_assignment_behavior = 5;
}
